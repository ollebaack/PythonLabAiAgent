version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: spotify-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru

  fastapi:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: spotify-fastapi
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./.spotify_cache:/app/.spotify_cache
      - ./agent.py:/app/agent.py
      - ./api:/app/api
    depends_on:
      - redis
    restart: unless-stopped
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
